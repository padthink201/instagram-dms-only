name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/signing.keystore
            echo "Using fixed signing key"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 secret not set - using a temporary key (updates will need a reinstall)"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DMs.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DMs-apk
          path: DMs.apk

      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DMs build ${{ github.run_number }}
          make_latest: true
          files: DMs.apk
